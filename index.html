<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baldur's Gate 3 Dialog</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1117;
      --bg-top: #172232;
      --panel: #101822;
      --panel-strong: #152132;
      --panel-hover: #1b2940;
      --text: #e7edf6;
      --muted: #99a7ba;
      --line: #2a3748;
      --link: #9dc2ff;
      --focus: #6f8eb4;
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
      --mark-bg: #5b4617;
      --mark-text: #fff0bf;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 1.4rem 1.6rem 2rem;
      background:
        radial-gradient(circle at top, var(--bg-top) 0, var(--bg) 34rem);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.4;
    }

    a {
      color: var(--link);
    }

    a:hover {
      color: #c7dcff;
    }

    h1 {
      margin: 0 0 1.1rem;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.05;
      letter-spacing: 0.01em;
    }

    .controls {
      display: grid;
      gap: 0.75rem;
      margin-bottom: 1.15rem;
      padding: 1rem 1rem 1.05rem;
      background: rgba(16, 24, 34, 0.86);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .search-row,
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      white-space: nowrap;
    }

    .toggle-label span {
      order: 2;
    }

    .toggle-label input[type="checkbox"] {
      width: 1rem;
      height: 1rem;
      margin: 0;
      accent-color: var(--accent);
    }

    .controls input,
    .controls select,
    .controls label {
      font: inherit;
    }

    .controls input {
      padding: 0.45rem 0.6rem;
      min-width: 22rem;
      flex: 1 1 28rem;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      outline: none;
    }

    .controls select {
      padding: 0.45rem 0.6rem;
      min-width: 14rem;
      flex: 0 1 18rem;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      outline: none;
    }

    .controls input::placeholder {
      color: #7e8da1;
    }

    .controls input:focus,
    .controls select:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 1px var(--focus);
    }

    .filter-row label {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--muted);
    }

    #status {
      margin: 0 0 1rem;
      color: var(--muted);
    }

    #results {
      padding-left: 1.25rem;
    }

    #results li {
      margin-bottom: 0.85rem;
    }

    #results.tree {
      list-style: none;
      padding-left: 0;
    }

    #results.tree ul {
      list-style: none;
      padding-left: 1.35rem;
      margin: 0.3rem 0 0.3rem;
    }

    #results.tree li {
      margin-bottom: 0.2rem;
    }

    #results.tree details {
      margin: 0.2rem 0;
    }

    #results.tree summary {
      cursor: pointer;
      color: var(--text);
    }

    .meta {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .excerpt {
      display: block;
      color: inherit;
      margin-top: 0.15rem;
      text-decoration: none;
    }

    .excerpt:visited,
    .excerpt:hover,
    .excerpt:active {
      color: inherit;
      text-decoration: none;
    }

    .size {
      color: var(--muted);
      font-size: 0.95rem;
      margin-left: 0.4rem;
      white-space: nowrap;
    }

    mark {
      background: var(--mark-bg);
      color: var(--mark-text);
      border-radius: 2px;
      padding: 0 0.08rem;
    }
  </style>
</head>
<body>
  <h1>Baldur's Gate 3 Dialog</h1>
  <div class="controls">
    <div class="search-row">
      <input id="query" type="search" placeholder="Search dialog text">
      <label>
        <span>Match</span>
        <select id="query-mode">
          <option value="contains">Contains</option>
          <option value="phrase">Phrase</option>
        </select>
      </label>
    </div>
    <div class="filter-row">
      <label>
        <span>Speaker</span>
        <select id="speaker">
          <option value="">All speakers</option>
        </select>
      </label>
      <label>
        <span>Mode</span>
        <select id="speaker-mode">
          <option value="includes">Includes speaker</option>
          <option value="only">Only that speaker</option>
        </select>
      </label>
      <label class="toggle-label">
        <input id="show-duplicates" type="checkbox">
        <span>Show duplicates</span>
      </label>
    </div>
  </div>
  <p id="status">Loading dialog files...</p>
  <ul id="results"></ul>
  <script>
    const queryInput = document.getElementById("query");
    const queryModeSelect = document.getElementById("query-mode");
    const speakerSelect = document.getElementById("speaker");
    const speakerModeSelect = document.getElementById("speaker-mode");
    const showDuplicatesCheckbox = document.getElementById("show-duplicates");
    const status = document.getElementById("status");
    const resultsList = document.getElementById("results");
    const workerCodeVersion = "2026-05-22-dedup-1";
    const searchDebounceMs = 280;
    let worker = null;
    const onlyModeIgnoredSpeakers = new Set(["Player", "Narrator", "No Speaker"]);

    let allDocuments = [];
    let assetVersion = "";
    let manifestReady = false;
    let clientSearchReady = false;
    let clientSearchLoadError = "";
    let pendingTimer = null;
    let latestSearchRequestId = 0;
    let activeSearchController = null;
    let clientSearchBootPromise = null;
    const loadedSpeakers = new Set();

    function formatSize(sizeBytes) {
      const units = ["B", "KB", "MB"];
      let value = Number(sizeBytes) || 0;
      let unitIndex = 0;

      while (value >= 1024 && unitIndex < units.length - 1) {
        value /= 1024;
        unitIndex += 1;
      }

      if (unitIndex === 0) {
        return value + " " + units[unitIndex];
      }
      return value.toFixed(value >= 10 ? 0 : 1) + " " + units[unitIndex];
    }

    function createSizeNode(sizeBytes) {
      const size = document.createElement("span");
      size.className = "size";
      size.textContent = "(" + formatSize(sizeBytes) + ")";
      return size;
    }

    function populateSpeakerOptions(speakers) {
      for (const speaker of speakers || []) {
        if (!speaker || loadedSpeakers.has(speaker)) {
          continue;
        }
        loadedSpeakers.add(speaker);
        const option = document.createElement("option");
        option.value = speaker;
        option.textContent = speaker;
        speakerSelect.appendChild(option);
      }
    }

    function shortenText(text, limit) {
      if (!text || text.length <= limit) {
        return text || "";
      }
      return text.slice(0, limit - 3).trimEnd() + "...";
    }

    function buildExcerptHref(result) {
      const documentPath = result.documentPath || (result.path || "").split("#")[0];
      const hashIndex = (result.path || "").indexOf("#");
      const hash = hashIndex === -1 ? "" : result.path.slice(hashIndex + 1);
      const url = new URL(documentPath, window.location.href);

      if (result.excerpt) {
        url.searchParams.set("line", result.excerpt);
      }
      if (hash) {
        url.hash = hash;
      }

      return url.href;
    }

    function getQueryTerms() {
      return queryInput.value
        .trim()
        .split(/\s+/)
        .filter(Boolean)
        .sort((a, b) => b.length - a.length);
    }

    function appendHighlightedText(container, text, terms) {
      if (!text) {
        return;
      }

      if (!terms.length) {
        container.textContent = text;
        return;
      }

      const lowerText = text.toLowerCase();
      let index = 0;

      while (index < text.length) {
        let matchedTerm = "";
        for (const term of terms) {
          if (lowerText.startsWith(term.toLowerCase(), index)) {
            matchedTerm = text.slice(index, index + term.length);
            break;
          }
        }

        if (matchedTerm) {
          const mark = document.createElement("mark");
          mark.textContent = matchedTerm;
          container.appendChild(mark);
          index += matchedTerm.length;
          continue;
        }

        let nextIndex = text.length;
        for (const term of terms) {
          const foundIndex = lowerText.indexOf(term.toLowerCase(), index);
          if (foundIndex !== -1 && foundIndex < nextIndex) {
            nextIndex = foundIndex;
          }
        }

        const plainText = text.slice(index, nextIndex);
        container.appendChild(document.createTextNode(plainText));
        index = nextIndex;
      }
    }

    function matchesSpeakerFilter(document, speaker, mode) {
      if (!speaker) {
        return true;
      }

      const speakers = Array.isArray(document.speakers) ? document.speakers : [];
      if (!speakers.includes(speaker)) {
        return false;
      }

      if (mode !== "only") {
        return true;
      }

      for (const otherSpeaker of speakers) {
        if (otherSpeaker === speaker) {
          continue;
        }
        if (onlyModeIgnoredSpeakers.has(otherSpeaker)) {
          continue;
        }
        return false;
      }

      return true;
    }

    function getTreeDocuments() {
      return allDocuments.filter((document) =>
        matchesSpeakerFilter(
          document,
          speakerSelect.value,
          speakerModeSelect.value
        )
      );
    }

    function buildTree(documents) {
      const root = { folders: new Map(), files: [] };

      for (const document of documents) {
        const parts = document.path.split("/");
        let current = root;
        for (let index = 0; index < parts.length - 1; index += 1) {
          const part = parts[index];
          if (!current.folders.has(part)) {
            current.folders.set(part, { folders: new Map(), files: [] });
          }
          current = current.folders.get(part);
        }
        current.files.push(document);
      }

      return root;
    }

    function renderTreeNode(node, parentElement, depth) {
      const folderNames = Array.from(node.folders.keys()).sort((a, b) =>
        a.localeCompare(b)
      );

      for (const folderName of folderNames) {
        const childNode = node.folders.get(folderName);
        const item = document.createElement("li");
        const details = document.createElement("details");
        if (
          (depth === 0 && folderName === "dialog") ||
          (depth === 1 && folderName === "Companions")
        ) {
          details.open = true;
        }

        const summary = document.createElement("summary");
        summary.textContent = folderName;
        details.appendChild(summary);

        const childList = document.createElement("ul");
        renderTreeNode(childNode, childList, depth + 1);
        details.appendChild(childList);

        item.appendChild(details);
        parentElement.appendChild(item);
      }

      const files = node.files.slice().sort((a, b) => a.title.localeCompare(b.title));
      for (const file of files) {
        const item = document.createElement("li");
        const link = document.createElement("a");
        link.href = file.path;
        link.textContent = file.title;
        item.appendChild(link);
        item.appendChild(createSizeNode(file.size_bytes));
        parentElement.appendChild(item);
      }
    }

    function renderTree(documents) {
      resultsList.className = "tree";
      resultsList.innerHTML = "";
      const tree = buildTree(documents);
      renderTreeNode(tree, resultsList, 0);
    }

    function renderTreeView() {
      if (!manifestReady) {
        return;
      }
      const filteredDocuments = getTreeDocuments();
      status.textContent =
        filteredDocuments.length +
        " dialog file" +
        (filteredDocuments.length === 1 ? "" : "s");
      renderTree(filteredDocuments);
    }

    function renderResults(payload) {
      resultsList.className = "";
      const shownCount = Array.isArray(payload.results) ? payload.results.length : 0;
      const countLabel = payload.truncated
        ? shownCount + "+"
        : String(payload.count);
      status.textContent =
        countLabel +
        " result" +
        ((payload.truncated ? shownCount : payload.count) === 1 ? "" : "s") +
        (payload.truncated ? " (showing first 500)" : "");
      resultsList.innerHTML = "";
      const showDetail = Boolean(queryInput.value.trim() || speakerSelect.value);
      const queryTerms = getQueryTerms();

      for (const result of payload.results) {
        const item = document.createElement("li");

        const link = document.createElement("a");
        link.href = result.documentPath || result.path;
        link.textContent = result.title;
        item.appendChild(link);
        item.appendChild(createSizeNode(result.sizeBytes));

        const path = document.createElement("div");
        path.className = "meta";
        path.textContent = result.documentPath || result.path;
        item.appendChild(path);

        if (showDetail && result.speakers && result.speakers.length) {
          const speakers = document.createElement("div");
          speakers.className = "meta";
          speakers.textContent = result.speakers.join(", ");
          item.appendChild(speakers);
        }

        if (showDetail && result.excerpt) {
          const excerpt = document.createElement("a");
          excerpt.className = "excerpt";
          excerpt.href = buildExcerptHref(result);
          appendHighlightedText(
            excerpt,
            shortenText(result.excerpt, 260),
            queryTerms
          );
          item.appendChild(excerpt);
        }

        resultsList.appendChild(item);
      }
    }

    function buildSearchPayload(requestId) {
      return {
        requestId,
        query: queryInput.value,
        queryMode: queryModeSelect.value,
        speaker: speakerSelect.value,
        speakerMode: speakerModeSelect.value,
        showDuplicates: showDuplicatesCheckbox.checked,
      };
    }

    function requestClientSearch(requestId) {
      if (!clientSearchReady) {
        status.textContent = clientSearchLoadError || "Loading search index...";
        ensureClientSearch().catch((error) => {
          clientSearchLoadError = error.message || "Failed to load search index";
          if (queryInput.value.trim()) {
            status.textContent = clientSearchLoadError;
          }
        });
        return;
      }

      worker.postMessage({
        type: "search",
        payload: buildSearchPayload(requestId),
      });
    }

    function requestServerSearch(requestId) {
      if (activeSearchController) {
        activeSearchController.abort();
      }

      const controller = new AbortController();
      activeSearchController = controller;
      status.textContent = "Searching...";

      const params = new URLSearchParams();
      const payload = buildSearchPayload(requestId);
      for (const [key, value] of Object.entries(payload)) {
        params.set(key, String(value || ""));
      }

      fetch("api/search?" + params.toString(), {
        signal: controller.signal,
        headers: {
          Accept: "application/json",
        },
      })
        .then((response) => {
          if (!response.ok) {
            const error = new Error("Search request failed");
            error.status = response.status;
            throw error;
          }
          return response.json();
        })
        .then((payload) => {
          if (
            requestId !== latestSearchRequestId ||
            !queryInput.value.trim()
          ) {
            renderTreeView();
            return;
          }
          renderResults(payload);
        })
        .catch((error) => {
          if (controller.signal.aborted) {
            return;
          }

          if (error.status === 404) {
            requestClientSearch(requestId);
            return;
          }

          status.textContent = error.message || "Search failed";
        })
        .finally(() => {
          if (activeSearchController === controller) {
            activeSearchController = null;
          }
        });
    }

    function requestSearch() {
      latestSearchRequestId += 1;
      const requestId = latestSearchRequestId;

      if (activeSearchController) {
        activeSearchController.abort();
        activeSearchController = null;
      }

      if (!queryInput.value.trim()) {
        renderTreeView();
        return;
      }

      requestServerSearch(requestId);
    }

    function scheduleSearch() {
      if (pendingTimer !== null) {
        clearTimeout(pendingTimer);
      }
      pendingTimer = window.setTimeout(requestSearch, searchDebounceMs);
    }

    function withVersion(url, version) {
      if (!version) {
        return url;
      }
      const separator = url.includes("?") ? "&" : "?";
      return url + separator + "v=" + encodeURIComponent(version);
    }

    function initWorker(assetVersion) {
      if (worker) {
        worker.terminate();
      }
      const workerVersion = assetVersion
        ? assetVersion + "-" + workerCodeVersion
        : workerCodeVersion;
      worker = new Worker(withVersion("search-worker.js", workerVersion));
      worker.onmessage = (event) => {
        const { type, payload } = event.data || {};

        if (type === "ready") {
          clientSearchReady = true;
          populateSpeakerOptions(payload.speakers || []);
          if (queryInput.value.trim()) {
            requestClientSearch(latestSearchRequestId);
          } else {
            renderTreeView();
          }
          return;
        }

        if (type === "results") {
          if (payload.requestId !== latestSearchRequestId || !queryInput.value.trim()) {
            renderTreeView();
            return;
          }
          renderResults(payload);
        }
      };
    }

    function ensureClientSearch() {
      if (clientSearchBootPromise) {
        return clientSearchBootPromise;
      }

      clientSearchBootPromise = Promise.resolve()
        .then(() => {
          initWorker(assetVersion);
          return loadSearchIndex(assetVersion);
        })
        .catch((error) => {
          clientSearchBootPromise = null;
          throw error;
        });

      return clientSearchBootPromise;
    }

    queryInput.addEventListener("input", scheduleSearch);
    queryModeSelect.addEventListener("change", requestSearch);
    speakerSelect.addEventListener("change", requestSearch);
    speakerModeSelect.addEventListener("change", requestSearch);
    showDuplicatesCheckbox.addEventListener("change", requestSearch);

    function loadSearchIndex(assetVersion) {
      return fetch(withVersion("search-index.json", assetVersion))
        .then((response) => {
          if (!response.ok) {
            throw new Error("Failed to load search index");
          }
          return response.json();
        })
        .then((data) => {
          worker.postMessage({
            type: "init",
            payload: {
              documents: data.documents || [],
              speakers: data.speakers || [],
            },
          });
        });
    }

    fetch("dialog-manifest.json", { cache: "no-store" })
      .then((response) => {
        if (!response.ok) {
          throw new Error("Failed to load dialog manifest");
        }
        return response.json();
      })
      .then((data) => {
        assetVersion = data.generated_at || "";
        allDocuments = data.documents || [];
        manifestReady = true;
        populateSpeakerOptions(data.speakers || []);
        renderTreeView();
      })
      .catch((error) => {
        status.textContent = error.message;
      });
  </script>
</body>
</html>
